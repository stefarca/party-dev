<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    The notification badge: the small icon Android puts in the status bar,
    and the source badge-96.png is rendered from. Android draws a badge from
    its alpha channel alone, every visible pixel in one flat colour, so an
    opaque icon becomes a solid square there. This is the buddy of
    favicon.svg (the same geometry as web/components/Brand.tsx) as a
    silhouette on a transparent canvas, with the face cut out of it, so the
    status bar shows the buddy itself. Keep it in step with the mark.
  -->
  <defs>
    <mask id="face">
      <rect width="24" height="24" fill="#fff" />
      <g transform="rotate(-7 12 12)">
        <circle cx="8.8" cy="11.4" r="1.8" fill="#000" />
        <path
          d="M13.6 11.7a2.7 2.7 0 0 1 3.6 0"
          fill="none"
          stroke="#000"
          stroke-width="1.85"
          stroke-linecap="round"
        />
        <path
          d="M9.4 15.2a3.1 3.1 0 0 0 5.6 0"
          fill="none"
          stroke="#000"
          stroke-width="1.95"
          stroke-linecap="round"
        />
      </g>
    </mask>
  </defs>
  <g transform="rotate(-7 12 12)" mask="url(#face)">
    <rect x="2.6" y="4.2" width="18.8" height="16.4" rx="7" fill="#ffffff" />
  </g>
</svg>
