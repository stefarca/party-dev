<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Full-bleed variant of favicon.svg, and the source the maskable and Apple
    touch PNGs in this directory are rendered from. It has no rounded corners
    of its own because both consumers supply their own mask, and its four
    tiles sit inside the maskable safe zone (the centre 80% circle), so a
    platform that crops to a circle still shows the whole mark.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d5cfa" />
      <stop offset="1" stop-color="#f25ca8" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#g)" />
  <rect x="9" y="9" width="6.22" height="6.22" rx="2.02" fill="#ffffff" />
  <rect x="16.78" y="9" width="6.22" height="6.22" rx="2.02" fill="#ffffff" fill-opacity="0.75" />
  <rect x="9" y="16.78" width="6.22" height="6.22" rx="2.02" fill="#ffffff" fill-opacity="0.75" />
  <rect x="16.78" y="16.78" width="6.22" height="6.22" rx="2.02" fill="#ffffff" fill-opacity="0.5" />
</svg>
