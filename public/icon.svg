<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Full-bleed variant of favicon.svg, and the source the maskable and Apple
    touch PNGs in this directory are rendered from. It has no rounded corners
    of its own because both consumers supply their own mask. The buddy spans
    about half the canvas: an Android launcher shows only the middle two
    thirds of a maskable icon (72 of its 108dp) and then crops that to its
    own shape, so a buddy sized merely to fit the spec's 80% safe zone fills
    the whole visible circle and reads as zoomed in.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d5cfa" />
      <stop offset="1" stop-color="#f25ca8" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#g)" />
  <g transform="translate(6.12 5.83) scale(0.82)">
    <g transform="rotate(-7 12 12)">
      <rect x="2.6" y="4.2" width="18.8" height="16.4" rx="7" fill="#ffffff" />
      <circle cx="8.8" cy="11.4" r="1.8" fill="#1a0e2b" />
      <path
        d="M13.6 11.7a2.7 2.7 0 0 1 3.6 0"
        fill="none"
        stroke="#1a0e2b"
        stroke-width="1.85"
        stroke-linecap="round"
      />
      <path
        d="M9.4 15.2a3.1 3.1 0 0 0 5.6 0"
        fill="none"
        stroke="#1a0e2b"
        stroke-width="1.95"
        stroke-linecap="round"
      />
    </g>
  </g>
</svg>
