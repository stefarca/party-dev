name: CI

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the coverage step post and update its comment on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:coverage
      - name: Coverage report
        # Reports only what Vitest can reach (worker, shared, game logic), for the files the PR
        # changes. It is informational: there is no threshold, so it never fails the job.
        if: ${{ !cancelled() }}
        uses: davelosert/vitest-coverage-report-action@v2
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: End-to-end tests
        # The e2e server reads SESSION_SECRET from the environment when there is no .dev.vars.
        # It only signs this run's throwaway sessions, so a fresh random key does.
        run: SESSION_SECRET="$(openssl rand -hex 32)" npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
