name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Inject deploy-time config
        run: |
          sed -i "s#\"database_id\": \"REPLACE_ME_SEE_README\"#\"database_id\": \"${CF_D1_DATABASE_ID}\"#" wrangler.jsonc
          sed -i "s#\"PUBLIC_BASE_URL\": \"http://localhost:5173\"#\"PUBLIC_BASE_URL\": \"${PUBLIC_BASE_URL}\"#" wrangler.jsonc
        env:
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
