version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Major versions need code changes beyond bumping
    # the library, so they are never proposed.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # One PR for all the minor and patch updates.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
