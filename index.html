<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pimpom</title>
    <meta name="description" content="Async party games you play a move at a time." />
    <link rel="icon" href="/favicon.svg" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Installable-app metadata. The manifest is a static file in public/
      rather than something the build generates, so it is byte-identical in
      dev, in the e2e server and in production. The two theme-color values
      are the light and dark `--surface-void` from web/styles.css, repeated
      here as literals for the same reason the theme bootstrap below repeats
      its storage key: this is plain HTML and cannot read a CSS custom
      property. Keep them in step with that token. The dark one comes second
      so it also answers a browser that ignores the media attribute, matching
      the dark default the bootstrap picks.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f3fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11091a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pimpom" />
    <!-- Opaque, so iOS keeps the web view below the status bar and no layout
         needs safe-area insets. `black-translucent` would need them. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!--
      Flash-free theme bootstrap: runs before the stylesheet loads so
      `data-theme` (and the matching class HeroUI also checks for) is already
      correct for the first paint. Must stay a blocking, non-module script
      ahead of the stylesheet link. "party-theme" duplicates
      THEME_STORAGE_KEY from web/theme.ts on purpose — this inline script
      can't import a module.
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var stored = window.localStorage.getItem("party-theme");
          theme = stored === "light" || stored === "dark" ? stored : null;
          if (!theme) {
            var prefersLight =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            theme = prefersLight ? "light" : "dark";
          }
        } catch (e) {
          theme = "dark";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.add(theme);
      })();
    </script>
    <!--
      Rounded display + text faces. `display=swap` and a full system fallback
      chain in web/styles.css mean a blocked or slow font request costs
      nothing but a different first paint — never a blank page.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
